<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#070707"/>
  <rect x="70" y="70" width="1460" height="760" rx="20" fill="#111313" stroke="#3d4a45" stroke-width="2"/>
  <text x="110" y="145" fill="#d8f3dc" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">Shared HTTP Client Configuration in the Hot Path</text>
  <text x="112" y="192" fill="#8ca39b" font-family="Inter, Arial, sans-serif" font-size="24">The bug was not UTF-8. The bug was mutating a singleton RestTemplate while requests were running.</text>

  <rect x="110" y="255" width="330" height="150" rx="14" fill="#16201c" stroke="#5fcf9f" stroke-width="2"/>
  <text x="145" y="315" fill="#f3fff8" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Request A</text>
  <text x="145" y="360" fill="#b8cbc4" font-family="Inter, Arial, sans-serif" font-size="22">removes String converter</text>

  <rect x="110" y="495" width="330" height="150" rx="14" fill="#201819" stroke="#ff8f70" stroke-width="2"/>
  <text x="145" y="555" fill="#fff7f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Request B</text>
  <text x="145" y="600" fill="#d6beb6" font-family="Inter, Arial, sans-serif" font-size="22">reads incomplete list</text>

  <rect x="590" y="295" width="420" height="300" rx="16" fill="#181b1b" stroke="#f2f2f2" stroke-width="2"/>
  <text x="635" y="355" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800">Singleton RestTemplate</text>
  <line x1="635" y1="392" x2="965" y2="392" stroke="#3d4a45" stroke-width="2"/>
  <text x="635" y="440" fill="#9fb4ac" font-family="JetBrains Mono, Menlo, monospace" font-size="22">[ json converter ]</text>
  <text x="635" y="485" fill="#ff8f70" font-family="JetBrains Mono, Menlo, monospace" font-size="22">[ temporary gap ]</text>
  <text x="635" y="530" fill="#9fb4ac" font-family="JetBrains Mono, Menlo, monospace" font-size="22">[ form converter ]</text>

  <rect x="1160" y="255" width="330" height="150" rx="14" fill="#201819" stroke="#ff8f70" stroke-width="2"/>
  <text x="1195" y="315" fill="#fff7f4" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">SSO Call Fails</text>
  <text x="1195" y="360" fill="#d6beb6" font-family="Inter, Arial, sans-serif" font-size="22">token/user lookup returns 4xx</text>

  <rect x="1160" y="495" width="330" height="150" rx="14" fill="#16201c" stroke="#5fcf9f" stroke-width="2"/>
  <text x="1195" y="555" fill="#f3fff8" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Stable Fix</text>
  <text x="1195" y="600" fill="#b8cbc4" font-family="Inter, Arial, sans-serif" font-size="22">configure once or isolate client</text>

  <path d="M445 330H570" stroke="#5fcf9f" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 318L580 330L560 342" stroke="#5fcf9f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M445 570H570" stroke="#ff8f70" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 558L580 570L560 582" stroke="#ff8f70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
