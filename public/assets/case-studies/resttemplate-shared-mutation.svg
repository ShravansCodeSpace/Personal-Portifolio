  <path d="M1135 558L1155 570L1135 582" stroke="#5fcf9f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="215" y="720" width="1170" height="58" rx="10" fill="#0b0d0c" stroke="#3d4a45"/>
  <text x="250" y="758" fill="#f3fff8" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Encoding configuration belongs at startup, not inside each live request.</text>
